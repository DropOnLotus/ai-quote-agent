# Base URL of your PolicyCenter instance
pc.base.url=http://localhost:8180/pc/rest

# Basic Auth credentials
# Default PC dev credentials — change these for your environment
pc.auth.username=su
pc.auth.password=gw

# HTTP connection settings
pc.http.connect.timeout.ms=10000
pc.http.socket.timeout.ms=30000
pc.http.connection.request.timeout.ms=5000

# Max parallel connections for quote engine
pc.http.max.connections=20
pc.http.max.connections.per.route=10

# ─────────────────────────────────────────────────────────────────────────────
# Claude AI configuration (Natural-Language Parser)
# ─────────────────────────────────────────────────────────────────────────────
# API key can also be supplied via the ANTHROPIC_API_KEY environment variable
# (env var takes priority over this property).
claude.api.key=

# Model used for NL field extraction
claude.model=claude-haiku-4-5-20251001

# Maximum tokens in the extraction response (JSON is small — 512 is plenty)
claude.max.tokens=512

# ─────────────────────────────────────────────────────────────────────────────
# REST API server configuration
# ─────────────────────────────────────────────────────────────────────────────
# Port the QuoteAgentServer will listen on
server.port=8080

# Idle sessions are removed after this many minutes of inactivity
server.session.timeout.minutes=30

# ── Claude AI (NLP extraction) ────────────────────────────────────
# Leave blank to disable NLP — all fields will be asked manually.
# Alternatively set ANTHROPIC_API_KEY environment variable (takes precedence).
claude.api.key=
claude.model=claude-haiku-4-5-20251001
claude.max.tokens=512
claude.api.url=https://api.anthropic.com/v1/messages

# ── REST API Server ───────────────────────────────────────────────
server.port=8080
server.session.timeout.minutes=30
